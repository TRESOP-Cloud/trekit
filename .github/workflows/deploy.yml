name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main # Triggers the build whenever you commit changes to main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy Autoloader Hub to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/autoloader # Points directly to the main dashboard menu folder
          branch: gh-pages # Deploys straight to your web publishing branch
